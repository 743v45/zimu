name: zimu
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'B站视频链接'
        required: false
      audio_url:
        description: '直接音频 CDN URL（由本地脚本生成，绕过地域限制）'
        required: false
      bv_id:
        description: 'BV 号（audio_url 模式必填）'
        required: false
      title:
        description: '视频标题'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl

      - name: 缓存模型
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: asr-models-v1

      - name: 安装 Python 依赖
        run: |
          pip install -U funasr 2>&1 | tail -3

      - name: 模式一：直接 URL 转写
        if: ${{ github.event.inputs.url != '' }}
        id: mode-url
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          bv=$(echo "$URL" | grep -oP '[A-Za-z0-9]+$')
          echo "bv=$bv" >> "$GITHUB_OUTPUT"
          python scripts/transcribe.py --url "$URL"

      - name: 模式二：CDN URL 转写
        if: ${{ github.event.inputs.audio_url != '' }}
        id: mode-cdn
        env:
          AUDIO_URL: ${{ github.event.inputs.audio_url }}
          BV_ID: ${{ github.event.inputs.bv_id }}
          TITLE: ${{ github.event.inputs.title }}
        run: |
          bv="${BV_ID:-unknown}"
          echo "bv=$bv" >> "$GITHUB_OUTPUT"
          mkdir -p captions

          # 下载音频
          curl -s -L -o audio.m4s \
            -H "Referer: https://www.bilibili.com" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "$AUDIO_URL"
          echo "下载完成: $(du -h audio.m4s | cut -f1)"

          # 转换
          ffmpeg -y -i audio.m4s -ar 16000 -ac 1 audio.wav 2>/dev/null

          # 转写
          python scripts/transcribe.py --audio audio.wav --bv_id "$bv"

      - name: 设置 BV 输出
        id: bv
        run: |
          bv="${{ steps.mode-url.outputs.bv }}${{ steps.mode-cdn.outputs.bv }}"
          echo "bv=$bv" >> "$GITHUB_OUTPUT"

      - name: 上传转写结果
        uses: actions/upload-artifact@v4
        with:
          name: captions-${{ steps.bv.outputs.bv }}
          path: captions/
          retention-days: 1

  deploy:
    needs: transcribe
    if: ${{ always() && needs.transcribe.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有转写结果
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 合并字幕文件
        run: |
          mkdir -p captions pages_out
          find artifacts -name '*.json' -exec cp {} captions/ \;
          find artifacts -name '*.srt' -exec cp {} captions/ \;
          echo "合并后字幕文件: $(ls captions/*.json 2>/dev/null | wc -l) 个"

      - name: 构建站点
        run: |
          cp site/* pages_out/ 2>/dev/null || true
          python scripts/build_site.py --output-dir pages_out
          cp -r captions pages_out/captions

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_out

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
