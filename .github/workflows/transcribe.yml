name: zimu
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'B站视频链接'
        required: false
      audio_url:
        description: '直接音频 CDN URL（由本地脚本生成，绕过地域限制）'
        required: false
      bv_id:
        description: 'BV 号'
        required: false
      title:
        description: '视频标题'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl

      - name: 缓存模型
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: asr-models-v1

      - name: 安装 Python 依赖
        run: |
          pip install -U faster-whisper 2>&1 | tail -3

      - name: 转写（URL 模式）
        if: ${{ github.event.inputs.url != '' }}
        id: mode-url
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          bv=$(echo "$URL" | grep -oP '[A-Za-z0-9]+$')
          echo "bv=$bv" >> "$GITHUB_OUTPUT"
          python scripts/transcribe.py --url "$URL"

      - name: 转写（CDN 音频模式）
        if: ${{ github.event.inputs.audio_url != '' }}
        id: mode-cdn
        env:
          AUDIO_URL: ${{ github.event.inputs.audio_url }}
          BV_ID: ${{ github.event.inputs.bv_id }}
        run: |
          bv="${BV_ID:-unknown}"
          echo "bv=$bv" >> "$GITHUB_OUTPUT"
          mkdir -p captions
          curl -s -L -o audio.m4s \
            -H "Referer: https://www.bilibili.com" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "$AUDIO_URL"
          ffmpeg -y -i audio.m4s -ar 16000 -ac 1 audio.wav 2>/dev/null
          python scripts/transcribe.py --audio audio.wav --bv_id "$bv"

      - name: 转写（弹幕模式 - 仅需 BV 号）
        if: ${{ github.event.inputs.bv_id != '' && github.event.inputs.audio_url == '' && github.event.inputs.url == '' }}
        id: mode-danmaku
        env:
          BV_ID: ${{ github.event.inputs.bv_id }}
        run: |
          echo "bv=$BV_ID" >> "$GITHUB_OUTPUT"
          mkdir -p captions
          python3 -c "
          import sys, json; sys.path.insert(0, 'scripts')
          from transcribe import fetch_danmaku, build_transcript
          from utils import segments_to_srt
          from pathlib import Path

          # 先获取 cid（弹幕 API 需要 oid=cid）
          import subprocess
          bv = '$BV_ID'
          r = subprocess.run(['curl', '-s', f'https://api.bilibili.com/x/web-interface/view?bvid={bv}'], capture_output=True, text=True)
          d = json.loads(r.stdout)
          if d.get('code') != 0:
              # 尝试用搜索 API 获取 aid
              print(f'view API 失败: {d.get(\"message\")}, 尝试弹幕直取...')
              # 用 BV 号推算 aid 或者直接用默认 cid
              aid = 0
              cid = 0
          else:
              aid = d['data']['aid']
              cid = d['data']['cid']
              print(f'视频: {d[\"data\"][\"title\"]}')

          if cid:
              segments = fetch_danmaku(aid, cid)
              print(f'弹幕: {len(segments)} 条')
          else:
              # 尝试多个 cid 段
              print('无法获取 cid，跳过')
              sys.exit(1)

          full_text = ' '.join(s['text'] for s in segments)
          transcript = {'bv_id': bv, 'title': d.get('data',{}).get('title',''), 'segments': segments, 'full_text': full_text}
          Path('captions').mkdir(exist_ok=True)
          Path(f'captions/{bv}.json').write_text(json.dumps(transcript, ensure_ascii=False, indent=2))
          Path(f'captions/{bv}.srt').write_text(segments_to_srt(segments))
          print(f'保存: {len(segments)} 条弹幕')
          "

      - name: 设置 BV 输出
        id: bv
        run: |
          bv="${{ steps.mode-url.outputs.bv }}${{ steps.mode-cdn.outputs.bv }}${{ steps.mode-danmaku.outputs.bv }}"
          echo "bv=$bv" >> "$GITHUB_OUTPUT"

      - name: 上传转写结果
        uses: actions/upload-artifact@v4
        with:
          name: captions-${{ steps.bv.outputs.bv }}
          path: captions/
          retention-days: 1

  deploy:
    needs: transcribe
    if: ${{ always() && needs.transcribe.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载所有转写结果
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 合并字幕文件
        run: |
          mkdir -p captions pages_out
          find artifacts -name '*.json' -exec cp {} captions/ \;
          find artifacts -name '*.srt' -exec cp {} captions/ \;
          echo "合并后字幕文件: $(ls captions/*.json 2>/dev/null | wc -l) 个"

      - name: 构建站点
        run: |
          cp site/* pages_out/ 2>/dev/null || true
          python scripts/build_site.py --output-dir pages_out
          cp -r captions pages_out/captions

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_out

      - name: 部署到 GitHub Pages
        uses: actions/deploy-pages@v4
